<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHEAT TODD - pulse preview</title>
<meta name="robots" content="noindex, nofollow">
<!--
  Offline harness for the live bot-catch visualization. Runs the EXACT same
  code path as the real page (pulse.js -> glitch.js) but against a built-in
  mock trap, so the whole thing is demoable with zero Cloudflare and zero
  network. Open over a local static server (ES modules do not load from
  file://):  python -m http.server 8788  ->  /pulse-preview.html
-->
<link rel="stylesheet" href="pulse.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#05030a;color:#fff;overflow:hidden;font-family:"Anton",system-ui,sans-serif}
  .stage{position:fixed;inset:0;overflow:hidden}
  .field{position:absolute;inset:0;background:url("assets/web/field.jpg") center/cover no-repeat}
  .vignette{position:absolute;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at 50% 58%,transparent 42%,rgba(5,3,10,.66) 100%)}

  /* dev HUD - live counters so the diff logic is visible while testing */
  .hud{position:fixed;left:12px;top:12px;z-index:9;
    font:600 12px/1.5 ui-monospace,Consolas,monospace;color:#e8dbbe;
    background:rgba(5,3,10,.62);border:1px solid #2a2340;border-radius:8px;
    padding:8px 11px;letter-spacing:.03em;pointer-events:none}
  .hud b{color:#3ad9f0}
  .hud .tag{color:#ff2bd1}
</style>
</head>
<body>
  <div class="stage">
    <div class="field"></div>
    <canvas class="scars"></canvas>
    <div class="weather"></div>
    <div class="swarm"></div>
    <div class="vignette"></div>
  </div>

  <div class="hud" id="hud"><span class="tag">MOCK TRAP</span> — waiting…</div>

  <!-- faster clock than production so the demo is lively -->
  <script>window.__PULSE_CONFIG__ = { mock: true, interval: 1200 };</script>
  <script type="module" src="pulse.js"></script>

  <!-- tiny HUD: reflects how many glitches are on stage (pulse.js owns the feed) -->
  <script>
    const hud = document.getElementById("hud");
    setInterval(() => {
      const n = document.querySelectorAll(".glitch-mote").length;
      hud.innerHTML = '<span class="tag">MOCK TRAP</span> — on stage: <b>'
        + n + "</b> glitches &middot; catches accruing live";
    }, 500);
  </script>
</body>
</html>
